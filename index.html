<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pedrinhas academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Saira+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg-000:#0a0d12;--bg-100:#11151c;--bg-200:#181d26;--line:#262d38;--line-strong:#3a4350;
  --grid-line:#ffffff0a;--accent-glow:#f29b1d2e;
  --ink:#e9edf2;--ink-muted:#a3adba;--ink-faint:#7f8a99;
  --accent:#f29b1d;--on-accent:#0a0d12;--brand-red:#ff4b42;--defense:#4aa8ff;--win:#4fd08f;--loss:#ff6a5c;
  --tier-copper:#c0714a;--tier-bronze:#cf9358;--tier-silver:#b9c3cd;--tier-gold:#f2c94c;--tier-platinum:#46d3c6;--tier-emerald:#4cd97b;--tier-diamond:#b896ff;--tier-champions:#ff5c93;
  --font-display:"Saira Condensed","Arial Narrow",sans-serif;--font-sans:"Barlow",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;
  --cut-sm:6px;--cut-md:14px;--cut-lg:28px;--radius-pill:999px;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
.wrap{max-width:960px;margin:0 auto;padding:var(--space-4) var(--space-4) 64px}
.pa-gap{height:var(--space-6)}
/* Pedrinhas Academy — componentes (CSS puro, prefixo pa-). Valores vêm de tokens.css. */

/* ---------- Base: fundo tático ---------- */
.pa-app {
  background-color: var(--bg-000);
  background-image:
    radial-gradient(ellipse 70% 360px at 50% -80px, var(--accent-glow), transparent 70%),
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 100% 100%, 48px 48px, 48px 48px;
  background-repeat: no-repeat, repeat, repeat;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px; line-height: 22px;
  -webkit-font-smoothing: antialiased;
}
.pa-app *, .pa-app *::before, .pa-app *::after { box-sizing: border-box; }
.pa-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 14px; }
.pa-label { font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.pa-caption { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink-faint); }
:where(.pa-app) :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- AppHeader ---------- */
.pa-hud {
  display: flex; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap;
  padding: var(--space-2) 0; border-bottom: 1px solid var(--line);
}
.pa-live { display: inline-flex; align-items: center; gap: var(--space-2); }
.pa-live::before { content: ""; width: 7px; height: 7px; border-radius: var(--radius-pill); background: var(--brand-red); box-shadow: 0 0 8px var(--brand-red); }
.pa-header {
  display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-5); flex-wrap: wrap;
  padding: var(--space-5) 0 var(--space-5);
}
.pa-wordmark {
  margin: 0;
  font-family: var(--font-display); font-style: italic; font-weight: 800;
  font-size: 52px; line-height: 48px; letter-spacing: .02em; text-transform: uppercase;
  color: var(--ink);
}
.pa-wordmark b { font-weight: 800; color: var(--brand-red); }
.pa-tagline { margin: var(--space-2) 0 0; display: flex; align-items: center; gap: var(--space-3); }
.pa-tagline::before { content: ""; width: 40px; height: 6px; background: repeating-linear-gradient(-45deg, var(--accent) 0 3px, transparent 3px 7px); }
.pa-games { display: flex; gap: var(--space-2); }
.pa-game {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-5);
  font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 16px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-muted); background: var(--bg-200); text-decoration: none;
  clip-path: polygon(var(--cut-md) 0, 100% 0, calc(100% - var(--cut-md)) 100%, 0 100%);
}
.pa-game[aria-current="page"] { color: var(--on-accent); background: var(--accent); }
.pa-game[aria-disabled="true"] { color: var(--ink-faint); background: var(--bg-100); cursor: not-allowed; }
.pa-game small { font-family: var(--font-sans); font-style: normal; font-size: 10px; letter-spacing: .14em; font-weight: 600; }

/* ---------- SectionTabs ---------- */
.pa-tabs { display: flex; flex-wrap: wrap; gap: var(--space-1); border-bottom: 1px solid var(--line-strong); }
.pa-tab {
  position: relative; padding: var(--space-3) var(--space-5);
  font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 20px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-faint); background: none; border: 0; cursor: pointer; text-decoration: none;
  transition: color .12s;
}
.pa-tab:hover { color: var(--ink); }
.pa-tab[aria-selected="true"] { color: var(--ink); background: linear-gradient(to top, var(--accent-glow), transparent); }
.pa-tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }

/* ---------- Section heading (com faixa de breach) ---------- */
.pa-heading {
  display: flex; align-items: center; gap: var(--space-3);
  margin: 0 0 var(--space-4);
  font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 24px; line-height: 28px; letter-spacing: .04em; text-transform: uppercase;
}
.pa-heading i { color: var(--accent); }
.pa-heading::after { content: ""; flex: 1; height: 8px; background: linear-gradient(90deg, var(--line-strong) 0 1px, transparent 1px) left center / 100% 1px no-repeat, repeating-linear-gradient(-45deg, var(--line-strong) 0 2px, transparent 2px 8px) right / 64px 8px no-repeat; }

/* ---------- StatTile (cantoneiras de HUD) ---------- */
.pa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-4); }
.pa-stat { position: relative; padding: var(--space-4) var(--space-5) var(--space-5); background: var(--bg-100); }
.pa-stat::before, .pa-stat::after { content: ""; position: absolute; width: 14px; height: 14px; }
.pa-stat::before { left: 0; top: 0; border-left: 2px solid var(--accent); border-top: 2px solid var(--accent); }
.pa-stat::after { right: 0; bottom: 0; border-right: 2px solid var(--line-strong); border-bottom: 2px solid var(--line-strong); }
.pa-stat__head { display: flex; justify-content: space-between; }
.pa-stat__value { display: block; margin-top: var(--space-2); font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 56px; line-height: 52px; font-variant-numeric: tabular-nums; }

/* ---------- RankEmblem + TierBadge ---------- */
.pa-emblem, .pa-tier { --t: var(--tier-silver); }
[data-tier="copper"]    { --t: var(--tier-copper); }
[data-tier="bronze"]    { --t: var(--tier-bronze); }
[data-tier="silver"]    { --t: var(--tier-silver); }
[data-tier="gold"]      { --t: var(--tier-gold); }
[data-tier="platinum"]  { --t: var(--tier-platinum); }
[data-tier="emerald"]   { --t: var(--tier-emerald); }
[data-tier="diamond"]   { --t: var(--tier-diamond); }
[data-tier="champions"] { --t: var(--tier-champions); }
[data-tier="unranked"]  { --t: var(--ink-faint); }

.pa-emblem {
  --s: 56px;
  position: relative; flex: none;
  display: inline-grid; place-items: center;
  width: var(--s); height: calc(var(--s) * 1.1547);
  background: var(--t);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
}
.pa-emblem::before {
  content: ""; position: absolute; inset: calc(var(--s) * .09);
  background: var(--bg-100);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
}
.pa-emblem::after {
  content: ""; position: relative; width: 48%; height: 40%;
  background: var(--t);
  clip-path: polygon(50% 0, 100% 38%, 100% 62%, 50% 24%, 0 62%, 0 38%);
}
.pa-emblem[data-tier="champions"]::before { background: var(--t); }
.pa-emblem[data-tier="champions"]::after { background: var(--bg-000); height: 46%; clip-path: polygon(50% 0,100% 28%,100% 44%,50% 16%,0 44%,0 28%); }
.pa-emblem[data-tier="unranked"]::after { content: "?"; width: auto; height: auto; background: none; clip-path: none; color: var(--ink-faint); font-family: var(--font-display); font-weight: 800; font-size: calc(var(--s) * .42); line-height: 1; }
.pa-emblem--sm { --s: 22px; }
.pa-emblem--lg { --s: 88px; }

.pa-tier {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-display); font-weight: 700; font-size: 12px; line-height: 16px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--t);
}

/* ---------- Podium (Top 3) ---------- */
.pa-podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: var(--space-4); }
.pa-pod {
  position: relative; display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: var(--space-5) var(--space-4); background: var(--bg-100);
  clip-path: polygon(0 0, calc(100% - var(--cut-md)) 0, 100% var(--cut-md), 100% 100%, 0 100%);
}
.pa-pod--1 { padding-top: var(--space-6); padding-bottom: var(--space-6); background: radial-gradient(ellipse at 50% 0, var(--accent-glow), transparent 70%), var(--bg-100); }
.pa-pod--1::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--accent); }
.pa-pod__pos { position: absolute; left: var(--space-4); top: var(--space-3); font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 28px; line-height: 28px; color: var(--ink-faint); }
.pa-pod--1 .pa-pod__pos { color: var(--accent); }
.pa-pod__name { margin: var(--space-3) 0 2px; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 26px; letter-spacing: .03em; text-transform: uppercase; overflow-wrap: anywhere; }
.pa-pod--1 .pa-pod__name { font-size: 26px; line-height: 30px; }
.pa-pod__nota { margin: var(--space-3) 0 var(--space-2); font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 44px; line-height: 44px; color: var(--accent); }
.pa-pod--1 .pa-pod__nota { font-size: 56px; line-height: 52px; }
.pa-pod__meta { display: flex; gap: var(--space-4); }

/* ---------- RankingTable ---------- */
.pa-table-wrap { background: var(--bg-100); overflow-x: auto; clip-path: polygon(0 0, calc(100% - var(--cut-md)) 0, 100% var(--cut-md), 100% 100%, 0 100%); }
.pa-table { width: 100%; border-collapse: collapse; min-width: 680px; }
.pa-table th { padding: var(--space-3) var(--space-4); background: var(--bg-200); text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line-strong); }
.pa-table th:nth-child(-n+2), .pa-table td:nth-child(-n+2) { text-align: left; }
.pa-table td { padding: var(--space-3) var(--space-4); text-align: right; border-bottom: 1px solid var(--line); vertical-align: middle; transition: background .12s; }
.pa-table tbody tr:hover td { background: var(--bg-200); }
.pa-pos { width: 60px; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 20px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.pa-row--podium .pa-pos { color: var(--accent); font-size: 24px; }
.pa-row--podium td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.pa-player { display: flex; align-items: center; gap: var(--space-3); }
.pa-player__text { display: flex; flex-direction: column; gap: 1px; }
.pa-player__name { font-weight: 600; color: var(--ink); }
.pa-nota { display: inline-flex; align-items: center; gap: var(--space-3); justify-content: flex-end; }
.pa-nota__value { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 3.2ch; }
.pa-bar { width: 80px; height: 4px; background: var(--bg-200); overflow: hidden; transform: skewX(-20deg); }
.pa-table tbody tr:hover .pa-bar { background: var(--line-strong); }
.pa-bar > span { display: block; height: 100%; background: var(--accent); }
.pa-good { color: var(--win); }
.pa-adj { color: var(--defense); }
.pa-table tr.pa-divider td { padding: var(--space-4) var(--space-4) var(--space-2); background: var(--bg-100); text-align: left; border-bottom: 1px solid var(--line-strong); }
.pa-row--prov .pa-pos { font-size: 14px; }
.pa-row--prov .pa-player__name { color: var(--ink-muted); }
.pa-row--prov .pa-nota__value { color: var(--ink-muted); }
.pa-row--prov .pa-bar > span { background: var(--ink-faint); }
.pa-placement { display: inline-flex; gap: 3px; vertical-align: middle; }
.pa-placement i { width: 10px; height: 4px; background: var(--line-strong); transform: skewX(-20deg); }
.pa-placement i.on { background: var(--ink-muted); }

/* ---------- Result pips ---------- */
.pa-form { display: inline-flex; gap: 3px; }
.pa-pip {
  display: inline-grid; place-items: center; width: 24px; height: 20px;
  font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 12px; line-height: 1; color: var(--bg-000);
  clip-path: polygon(var(--cut-sm) 0, 100% 0, calc(100% - var(--cut-sm)) 100%, 0 100%);
}
.pa-pip--v { background: var(--win); }
.pa-pip--d { background: var(--loss); }

/* ---------- PlayerCard ---------- */
.pa-card {
  position: relative; background: var(--bg-100); padding: var(--space-5);
  clip-path: polygon(0 0, calc(100% - var(--cut-lg)) 0, 100% var(--cut-lg), 100% 100%, 0 100%);
}
.pa-card::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--t, var(--accent)) 0 64px, var(--line) 64px); }
.pa-card__top { display: flex; align-items: center; gap: var(--space-4); }
.pa-card__rank { position: absolute; right: var(--space-6); top: var(--space-4); font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: 72px; line-height: 60px; color: var(--bg-200); letter-spacing: -.02em; }
.pa-card__name { position: relative; margin: 2px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 32px; letter-spacing: .02em; text-transform: uppercase; overflow-wrap: anywhere; }
.pa-card__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); margin: var(--space-5) 0; padding-top: var(--space-4); border-top: 1px solid var(--line); }
.pa-card__big { display: block; margin-top: var(--space-1); font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 34px; line-height: 34px; font-variant-numeric: tabular-nums; }
.pa-card__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }

/* ---------- MatchCard ---------- */
.pa-match { background: var(--bg-100); clip-path: polygon(0 0, calc(100% - var(--cut-md)) 0, 100% var(--cut-md), 100% 100%, 0 100%); }
.pa-match__top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--line); }
.pa-match__map { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 24px; line-height: 26px; letter-spacing: .04em; text-transform: uppercase; }
.pa-match__score { display: flex; align-items: center; gap: var(--space-3); font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 44px; line-height: 44px; font-variant-numeric: tabular-nums; }
.pa-match__score .o { color: var(--accent); }
.pa-match__score .b { color: var(--defense); }
.pa-match__score .sep { color: var(--ink-faint); font-size: 24px; }
.pa-rounds { display: grid; gap: 3px; justify-self: end; }
.pa-rounds__row { display: flex; gap: 3px; }
.pa-rounds__row i { width: 10px; height: 10px; background: var(--bg-200); }
.pa-rounds__row--o i.w { background: var(--accent); }
.pa-rounds__row--b i.w { background: var(--defense); }
.pa-match__teams { display: grid; grid-template-columns: 1fr 1fr; }
.pa-team { padding: var(--space-3) var(--space-5) var(--space-4); }
.pa-team + .pa-team { border-left: 1px solid var(--line); }
.pa-team__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); padding-bottom: var(--space-2); }
.pa-team__name { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; }
.pa-team--o .pa-team__name { color: var(--accent); }
.pa-team--b .pa-team__name { color: var(--defense); }
.pa-team ol { list-style: none; margin: 0; padding: 0; }
.pa-team li { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; }
.pa-team li .pa-num { color: var(--ink-muted); }
.pa-mvp { display: inline-block; margin-left: var(--space-2); padding: 1px 6px; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 11px; letter-spacing: .1em; color: var(--on-accent); background: var(--accent); }
.pa-result { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.pa-result--v { color: var(--win); }
.pa-result--d { color: var(--loss); }

/* ---------- Celular ---------- */
@media (max-width: 640px) {
  .pa-podium { grid-template-columns: 1fr; }
  .pa-pod--1 { order: -1; }
  .pa-wordmark { font-size: 38px; line-height: 36px; }
  .pa-match__top { grid-template-columns: 1fr auto; }
  .pa-rounds { grid-column: 1 / -1; justify-self: start; }
  .pa-match__teams { grid-template-columns: 1fr; }
  .pa-team + .pa-team { border-left: 0; border-top: 1px solid var(--line); }
}

/* ---------- Extras do site ---------- */
.pa-click{cursor:pointer}
.pa-panel{background:var(--bg-100);padding:var(--space-5);clip-path:polygon(0 0,calc(100% - var(--cut-md)) 0,100% var(--cut-md),100% 100%,0 100%)}
.pa-panel p{margin:0 0 var(--space-3)}
.pa-panel ol{margin:0;padding-left:20px}
.pa-panel li{margin-bottom:var(--space-3);color:var(--ink-muted)}
.pa-panel li b{color:var(--ink)}
.pa-panel code{font-family:var(--font-mono);font-size:13px;background:var(--bg-200);padding:2px 6px;color:var(--accent);overflow-wrap:anywhere}
.pa-list{display:grid;gap:var(--space-4)}
.pa-match__top{grid-template-columns:1fr auto}
.pa-btn{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border:0;padding:var(--space-2) var(--space-5);color:var(--on-accent);background:var(--accent);clip-path:polygon(var(--cut-sm) 0,100% 0,calc(100% - var(--cut-sm)) 100%,0 100%)}
.pa-btn--ghost{background:var(--bg-200);color:var(--ink-muted)}
.pa-btn--ghost:hover{color:var(--ink)}
.pa-btn--sm{font-size:12px;padding:4px var(--space-4)}
.pa-btn--danger{color:var(--loss)}
.pa-input,.pa-select{font-family:var(--font-sans);font-size:15px;color:var(--ink);background:var(--bg-200);border:1px solid var(--line-strong);border-radius:0;padding:var(--space-2) var(--space-3);min-width:0;width:100%}
.pa-select{width:auto;max-width:100%}
.pa-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-4);margin-bottom:var(--space-4)}
.pa-field{display:flex;flex-direction:column;gap:var(--space-1)}
.pa-tblock{border:1px solid var(--line);padding:var(--space-4);margin-bottom:var(--space-4)}
.pa-tblock__head{display:flex;gap:var(--space-3);align-items:center;margin-bottom:var(--space-3)}
.pa-tblock__head .pa-input{width:90px}
.pa-prow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:6px}
.pa-toolbar{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;margin-bottom:var(--space-4)}
.pa-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-4)}
.pa-cards .pa-card{cursor:pointer}
.pa-chart{background:var(--bg-100);padding:var(--space-4);overflow-x:auto}
.pa-empty{background:var(--bg-100);padding:var(--space-6);text-align:center;color:var(--ink-muted)}
.pa-tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-2);margin-top:var(--space-3)}
.pa-tiers div{display:flex;align-items:center;gap:var(--space-2);justify-content:space-between;background:var(--bg-200);padding:6px var(--space-3)}
.pa-tab{white-space:nowrap}
.pa-tabs{overflow-x:auto;flex-wrap:nowrap}

.pa-trendcell{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.pa-trend{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.02em}
.pa-trend--up{color:var(--win)}.pa-trend--down{color:var(--loss)}.pa-trend--flat{color:var(--ink-faint)}.pa-trend--new{color:var(--accent);text-transform:uppercase;font-size:10px}

.pa-alist{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:6px}.pa-alist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);font-size:14px}

.pa-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.pa-chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;padding:8px 12px;background:var(--bg-100);border:1px solid var(--line);color:var(--ink-muted);font-family:var(--font-sans)}
.pa-chip__n{font-weight:600;font-size:14px;color:inherit;word-break:break-all}
.pa-chip__s{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint)}
.pa-chip--1{border-color:var(--accent);color:var(--ink);background:var(--accent-glow)}
.pa-chip--2{border-color:var(--defense);border-style:dashed;color:var(--ink)}
.pa-chip:hover{border-color:var(--line-strong)}

.pa-tab{padding:12px 14px;font-size:15px;letter-spacing:.07em;flex-shrink:0}
</style>

    var ms = d.matches.slice(), c = core(ms), N = ms.length, snaps = [];
    for(var i=1;i<=N;i++){
      var s = core(ms.slice(0,i)), mp = {};
      s.list.forEach(function(p){ mp[p.name] = {score:p.score, pos:p.pos, n:p.n}; });
      snaps.push(mp);
    }
    c.list.forEach(function(p){
      p.evo = [];
      ms.forEach(function(m, i){
        var inM = m.teams.some(function(t){ return t.players.some(function(s){ return s.p === p.name; }); });
        if(inM && snaps[i][p.name]) p.evo.push({m:i+1, score:snaps[i][p.name].score, pos:snaps[i][p.name].pos, n:snaps[i][p.name].n});
      });
      p.move = null; p.dScore = null;
      if(N > TREND){
        var prev = snaps[N-1-TREND][p.name];
        p.dScore = prev ? p.score - prev.score : null;
        if(p.ranked){
          if(!prev || !prev.pos) p.move = 'new';
          else p.move = prev.pos - p.pos;
        }
      }
    });
    return c;
  }

  function tierOf(score, pos){
    if(pos <= 3) return 'champions';
    if(score >= 54) return 'diamond';
    if(score >= 52) return 'emerald';
    if(score >= 50) return 'platinum';
    if(score >= 48) return 'gold';
    if(score >= 46) return 'silver';
    if(score >= 44) return 'bronze';
    return 'copper';
  }

  function spark(hist){
    var W = Math.max(640, hist.length*52), H = 160, pad = 28;
    var max = CAP, n = hist.length;
    function X(i){ return n===1 ? W/2 : pad + i*(W-2*pad)/(n-1); }
    function Y(v){ return H - pad - (v/max)*(H-2*pad); }
    var pts = hist.map(function(x,i){ return X(i)+','+Y(x.kd); }).join(' ');
    var svg = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="K/D por partida">';
    svg += '<line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+Y(1)+'" y2="'+Y(1)+'" stroke="var(--line-strong)" stroke-dasharray="4 4"/>';
    svg += '<text x="4" y="'+(Y(1)+4)+'" font-size="11" fill="var(--ink-faint)" font-family="IBM Plex Mono, monospace">1,0</text>';
    if(n>1) svg += '<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="'+pts+'"/>';
    hist.forEach(function(x,i){
      svg += '<circle cx="'+X(i)+'" cy="'+Y(x.kd)+'" r="5" fill="'+(x.res==='W'?'var(--win)':'var(--loss)')+'"><title>'+esc(x.map||'')+' · '+x.k+'–'+x.d+'</title></circle>';
    });
    return svg + '</svg><div class="pa-caption">Verde = vitória (V), vermelho = derrota (D). Linha tracejada = K/D 1,0.</div>';
  }

  function canon(raw){
    var n = String(raw||'').trim(), l = n.toLowerCase();
    if(STATE.aliases[l]) return STATE.aliases[l];
    var kn = knownPlayers();
    for(var i=0;i<kn.length;i++) if(kn[i].toLowerCase() === l) return kn[i];
    return n;
  }

  function pairStats(ms){
    var P = {};
    ms.forEach(function(m){
      m.teams.forEach(function(t, ti){
        var won = t.score > m.teams[1-ti].score, names = t.players.map(function(s){ return s.p; }).sort();
        for(var i=0;i<names.length;i++) for(var j=i+1;j<names.length;j++){
          var k = names[i]+'|'+names[j];
          var o = P[k] || (P[k] = {a:names[i], b:names[j], n:0, w:0});
          o.n++; if(won) o.w++;
        }
      });
    });
    return Object.keys(P).map(function(k){ var o = P[k]; o.wr = o.w/o.n; o.adj = (o.w+2)/(o.n+4); return o; });
  }

  function mapGroup(c){
    var G = {};
    c.matches.forEach(function(m){
      var key = m.map || 'Mapa não informado', g = G[key] || (G[key] = {map:key, n:0, pl:{}});
      g.n++;
      m.teams.forEach(function(t){ t.players.forEach(function(s){
        var o = g.pl[s.p] || (g.pl[s.p] = {name:s.p, n:0, k:0, d:0}); o.n++; o.k += s.k; o.d += s.d;
      }); });
    });
    return Object.keys(G).map(function(k){
      var g = G[k], best = null;
      Object.keys(g.pl).forEach(function(n){ var o = g.pl[n]; if(o.n < 2) return; o.kd = o.k/Math.max(o.d,1); if(!best || o.kd > best.kd) best = o; });
      g.king = best; return g;
    }).sort(function(a,b){ return b.n - a.n; });
  }

  function records(c){
    var r = {k:null, sal:null, a:null, ws:null, ls:null, up:null, dn:null, busy:null};
    c.matches.forEach(function(m,i){ m.teams.forEach(function(t){ t.players.forEach(function(s){
      var it = {p:s.p, k:s.k, d:s.d, a:s.a||0, map:m.map||'', i:i+1};
      if(!r.k || s.k > r.k.k) r.k = it;
      if(!r.sal || s.k-s.d > r.sal.k-r.sal.d) r.sal = it;
      if(!r.a || it.a > r.a.a) r.a = it;
    }); }); });
    c.list.forEach(function(p){
      var w = 0, l = 0;
      p.hist.forEach(function(x){
        if(x.res === 'W'){ w++; l = 0; if(!r.ws || w > r.ws.n) r.ws = {p:p.name, n:w}; }
        else { l++; w = 0; if(!r.ls || l > r.ls.n) r.ls = {p:p.name, n:l}; }
      });
      if(p.dScore !== null){
        if(!r.up || p.dScore > r.up.v) r.up = {p:p.name, v:p.dScore};
        if(!r.dn || p.dScore < r.dn.v) r.dn = {p:p.name, v:p.dScore};
      }
      if(!r.busy || p.n > r.busy.n) r.busy = {p:p.name, n:p.n};
    });
    return r;
  }

  function vHighlights(c){
    if(!c.matches.length) return emptyBox();
    var r = records(c), boxes = [], i = 0;
    function add(label, value, sub){ i++; boxes.push(statBox(label, pad2(i), value, sub)); }
    add('Mais kills (partida)', r.k.k, esc(r.k.p)+' · '+esc(r.k.map)+' (partida '+r.k.i+')');
    add('Melhor saldo K–D', '+'+(r.sal.k-r.sal.d), esc(r.sal.p)+' · '+r.sal.k+'–'+r.sal.d+' · '+esc(r.sal.map));
    add('Mais assistências', r.a.a, esc(r.a.p)+' · '+esc(r.a.map)+' (partida '+r.a.i+')');
    add('Seq. de vitórias', r.ws.n, esc(r.ws.p));
    add('Seq. de derrotas', r.ls.n, esc(r.ls.p));
    add('Mais partidas', r.busy.n, esc(r.busy.p));

  function addAlias(){
    var msg = document.getElementById('a-msg'), nick = document.getElementById('a-new').value.trim(), tgt = canon(document.getElementById('a-tgt').value);
    if(!nick || !tgt){ msg.textContent = 'Preencha o apelido e o jogador oficial.'; return; }
    if(nick.toLowerCase() === tgt.toLowerCase()){ msg.textContent = 'O apelido precisa ser diferente do nome oficial.'; return; }
    if(knownPlayers().indexOf(tgt) < 0){ msg.textContent = 'O jogador oficial precisa já ter partida lançada.'; return; }
    var clash = STATE.matches.some(function(m){ return m.teams.some(function(t){ var ns = t.players.map(function(s){ return s.p.toLowerCase(); }); return ns.indexOf(nick.toLowerCase()) >= 0 && ns.indexOf(tgt.toLowerCase()) >= 0; }); });
    if(clash){ msg.textContent = 'Os dois nomes aparecem juntos numa mesma partida, então não são a mesma pessoa.'; return; }
    STATE.aliases[nick.toLowerCase()] = tgt;
    STATE.matches.forEach(function(m){ m.teams.forEach(function(t){ t.players.forEach(function(s){ if(s.p.toLowerCase() === nick.toLowerCase()) s.p = tgt; }); }); });
    msg.textContent = 'Salvando...';
    publish();
  }

  var tsel = null, topt = 0;
  function loadTsel(c){
    var ok = false;
    try { var s = JSON.parse(localStorage.getItem('pa-teams') || 'null'); if(s && typeof s === 'object'){ tsel = s; ok = true; } } catch(e){}
    if(ok){ var any = Object.keys(tsel).some(function(n){ return c.per[n]; }); if(!any) ok = false; }
    if(!ok) defaultTsel(c);
  }
  function defaultTsel(c){
    tsel = {};
    var l = c.list.slice().sort(function(a,b){ return b.n - a.n || b.score - a.score; });
    l.forEach(function(p,i){ if(i < 10) tsel[p.name] = 1; else if(i < 15) tsel[p.name] = 2; });
  }
  function saveTsel(){ try { localStorage.setItem('pa-teams', JSON.stringify(tsel)); } catch(e){} }

  function combos(arr, k, first){
    var out = [];
    (function rec(start, cur){
      if(cur.length === k){ out.push(cur.slice()); return; }
      for(var i=start;i<arr.length;i++){ cur.push(arr[i]); rec(i+1, cur); cur.pop(); }
    })(1, [arr[0]]);
    return out;
  }

  function teamPlan(c){
    var st = [], rs = [], note = '';
    Object.keys(tsel).forEach(function(n){ var p = c.per[n]; if(!p) return; if(tsel[n] === 1) st.push(p); else if(tsel[n] === 2) rs.push(p); });
    st.sort(function(a,b){ return b.n - a.n || b.score - a.score; });
    if(st.length > 10){ rs = rs.concat(st.slice(10)); note = 'Passou de 10 jogadores marcados: quem tem menos partidas virou reserva.'; st = st.slice(0,10); }
    if(st.length % 2 === 1){ rs.push(st.pop()); note = 'Número ímpar de jogadores: quem tem menos partidas virou reserva.'; }
    rs.sort(function(a,b){ return b.score - a.score; });
    if(st.length < 2) return {st:st, rs:rs, opts:[], note:note};
    var pm = {};
    pairStats(c.matches).forEach(function(o){ pm[o.a+'|'+o.b] = o; });
    function syn(T){
      var s = 0, nm = T.map(function(p){ return p.name; }).sort();
      for(var i=0;i<nm.length;i++) for(var j=i+1;j<nm.length;j++){ var o = pm[nm[i]+'|'+nm[j]]; if(o && o.n >= 3) s += (o.adj - 0.5) * 10; }
      return s;
    }
    function sum(T, f){ return T.reduce(function(a,p){ return a + f(p); }, 0); }
    var opts = combos(st, st.length/2).map(function(A){
      var B = st.filter(function(p){ return A.indexOf(p) < 0; });
      var sa = sum(A, function(p){ return p.score; }), sb = sum(B, function(p){ return p.score; });
      var ka = sum(A, function(p){ return p.totalKD; }), kb = sum(B, function(p){ return p.totalKD; });
      var ya = syn(A), yb = syn(B);
      return {A:A, B:B, sa:sa, sb:sb, ka:ka, kb:kb, cost:Math.abs(sa-sb) + 2*Math.abs(ka-kb) + 1.5*Math.abs(ya-yb)};
    });
    opts.sort(function(x,y){ return x.cost - y.cost; });
    return {st:st, rs:rs, opts:opts.slice(0,3), note:note};
  }

  function teamCol(T, sum, cls, name){
    T = T.slice().sort(function(a,b){ return b.score - a.score; });
    return '<div class="pa-team pa-team--'+cls+'"><div class="pa-team__head"><span class="pa-team__name">'+name+'</span><span class="pa-caption">soma '+f1(sum)+' · média '+f1(sum/T.length)+'</span></div><ol>'
      + T.map(function(p){ return '<li><span>'+esc(p.name)+'</span><span class="pa-num">'+f1(p.score)+'</span></li>'; }).join('') + '</ol></div>';
  }

      }).join('') + '</div>'

    h += '<article class="pa-match" style="margin-top:12px"><div class="pa-match__teams">' + teamCol(o.A,o.sa,'o','Time A') + teamCol(o.B,o.sb,'b','Time B') + '</div></article>';

    h += '<div class="pa-toolbar" style="margin-top:8px"><button class="pa-btn pa-btn--sm" data-act="teams-copy">Copiar times</button><span class="pa-caption" id="t-msg"></span></div>';
    if(plan.rs.length){
      h += '<div class="pa-gap"></div>' + heading('03','Reservas');
      h += '<div class="pa-table-wrap"><table class="pa-table" style="min-width:420px"><thead><tr><th class="pa-label" style="text-align:left">Se faltar</th><th class="pa-label" style="text-align:left">Entra</th><th class="pa-label">Diferença de nota</th></tr></thead><tbody>'
        + plan.st.slice().sort(function(a,b){ return b.score - a.score; }).map(function(p){
          var best = null; plan.rs.forEach(function(r){ if(!best || Math.abs(r.score-p.score) < Math.abs(best.score-p.score)) best = r; });
          var dlt = best.score - p.score;
          return '<tr class="pa-row"><td style="text-align:left"><span class="pa-player__name">'+esc(p.name)+'</span> <span class="pa-caption">'+f1(p.score)+'</span></td><td style="text-align:left">'+esc(best.name)+' <span class="pa-caption">'+f1(best.score)+' · '+best.n+'j</span></td><td class="pa-num'+(Math.abs(dlt)<=4?' pa-good':'')+'">'+(dlt>0?'+':'')+f1(dlt)+'</td></tr>';
        }).join('') + '</tbody></table></div><p class="pa-caption" style="margin-top:12px">Mostra o reserva com a nota mais parecida com a de cada titular. Se faltar mais de um, é só desmarcar os dois e o site refaz a divisão.</p>';
    }
    return h;
  }

  function trendTag(p){
    if(p.move === null) return '';
    if(p.move === 'new') return '<span class="pa-trend pa-trend--new">novo</span>';
    if(p.move > 0) return '<span class="pa-trend pa-trend--up">▲ '+p.move+'</span>';
    if(p.move < 0) return '<span class="pa-trend pa-trend--down">▼ '+(-p.move)+'</span>';
    return '<span class="pa-trend pa-trend--flat">=</span>';
  }
  function trendCell(p){
    var e = p.evo.slice(-8), n = e.length;
    var out = '<span class="pa-trendcell">';
    if(n >= 2){
      var mn = Infinity, mx = -Infinity; e.forEach(function(x){ mn = Math.min(mn,x.score); mx = Math.max(mx,x.score); });
      var rg = Math.max(mx-mn, 2), W = 76, H = 24, pd = 3;
      var pts = e.map(function(x,i){ return (pd + i*(W-2*pd)/(n-1)).toFixed(1)+','+(H-pd-((x.score-mn)/rg)*(H-2*pd)).toFixed(1); }).join(' ');
      var up = e[n-1].score - e[0].score, col = up > 0.05 ? 'var(--win)' : (up < -0.05 ? 'var(--loss)' : 'var(--ink-faint)');
      var last = pts.split(' ').pop().split(',');
      out += '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-label="Evolução da nota"><polyline fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" points="'+pts+'"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="3" fill="'+col+'"/></svg>';
    }
    return out + trendTag(p) + '</span>';
  }

  function evoChart(p, mode){
    var pts = p.evo.filter(function(x){ return mode === 'pos' ? x.pos > 0 : true; });
    if(!pts.length) return '<div class="pa-caption">'+(mode==='pos' ? 'Ainda sem posição oficial: o jogador entra no ranking com '+MIN+' partidas.' : 'Sem dados ainda.')+'</div>';
    var n = pts.length, W = Math.max(640, n*52), H = 190, pl = 46, pr = 18, pt = 18, pb = 26;
    var vals = pts.map(function(x){ return mode === 'pos' ? x.pos : x.score; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if(mode === 'pos'){ lo = 1; hi = Math.max(hi, 3); } else { lo = Math.floor(lo - 1); hi = Math.ceil(hi + 1); }
    function X(i){ return n === 1 ? W/2 : pl + i*(W-pl-pr)/(n-1); }
    function Y(v){ var t = (v-lo)/(hi-lo || 1); return mode === 'pos' ? pt + t*(H-pt-pb) : H - pb - t*(H-pt-pb); }
    var svg = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(mode==='pos'?'Posição no ranking':'Evolução da nota')+'">';
    if(mode === 'pos'){
      for(var g = 1; g <= hi; g++) svg += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="var(--line)"/><text x="4" y="'+(Y(g)+4)+'" font-size="11" fill="var(--ink-faint)" font-family="IBM Plex Mono, monospace">#'+g+'</text>';
    } else {
      [[44,'bronze'],[46,'silver'],[48,'gold'],[50,'platinum'],[52,'emerald'],[54,'diamond']].forEach(function(t){
        if(t[0] > lo && t[0] < hi) svg += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(t[0])+'" y2="'+Y(t[0])+'" stroke="var(--line-strong)" stroke-dasharray="4 4"/><text x="4" y="'+(Y(t[0])+4)+'" font-size="11" fill="var(--ink-faint)" font-family="IBM Plex Mono, monospace">'+t[0]+'</text>';
      });
    }
    var line = pts.map(function(x,i){ return X(i).toFixed(1)+','+Y(mode==='pos'?x.pos:x.score).toFixed(1); }).join(' ');
    if(n > 1) svg += '<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="'+line+'"/>';
    pts.forEach(function(x,i){
      var h = p.hist[p.evo.indexOf(x)], w = h && h.res === 'W', placing = x.n < MIN;
      svg += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(mode==='pos'?x.pos:x.score).toFixed(1)+'" r="5" fill="'+(placing ? 'var(--bg, #0b0d10)' : (w?'var(--win)':'var(--loss)'))+'" stroke="'+(w?'var(--win)':'var(--loss)')+'" stroke-width="2"><title>Partida '+x.m+(h?' · '+esc(h.map||'')+' · '+h.k+'–'+h.d:'')+' · '+(mode==='pos' ? '#'+x.pos : 'nota '+f1(x.score))+'</title></circle>';
      if(i === n-1) svg += '<text x="'+(X(i)-4)+'" y="'+(Y(mode==='pos'?x.pos:x.score)-10)+'" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono, monospace">'+(mode==='pos'?'#'+x.pos:f1(x.score))+'</text>';
    });
    svg += '</svg>';
    return svg + '<div class="pa-caption">'+(mode==='pos' ? 'Posição no ranking oficial depois de cada partida dele (#1 no topo).' : 'Nota depois de cada partida dele. Bolinha vazada = ainda em placement (menos de '+MIN+' partidas). Verde = vitória, vermelho = derrota. Linhas tracejadas = faixas de rank.')+'</div>';
  }

  function vAdmin(){
    return heading('01','Lançar partida') + '<div class="pa-panel"><div class="pa-fields">'
      + '<label class="pa-field"><span class="pa-label">Data (opcional)</span><input class="pa-input" id="f-date" type="date"></label>'
      + '<label class="pa-field"><span class="pa-label">Mapa</span><input class="pa-input" id="f-map" list="maplist" placeholder="Ex.: Clube"></label></div>'
      + '<datalist id="maplist">'+MAPS.map(function(m){ return '<option value="'+esc(m)+'">'; }).join('')+'</datalist>'
      + '<datalist id="plist">'+knownPlayers().concat(Object.keys(STATE.aliases)).map(function(m){ return '<option value="'+esc(m)+'">'; }).join('')+'</datalist>'
      + tblock(1,'Orange Team') + tblock(2,'Blue Team')
      + '<button class="pa-btn" data-act="save-match">Salvar partida</button>'
      + '<p class="pa-caption" id="f-msg" style="margin-top:12px"></p></div>'
      + '<div class="pa-gap"></div>' + heading('02','Apelidos')
      + '<div class="pa-panel"><p class="pa-caption">Quando alguém trocar de nick ou você quiser digitar um nome curto, cadastre aqui. O nome digitado vira o jogador oficial ao lançar partida. Se o nick novo já tiver partidas, elas são unidas ao oficial.</p>'
      + '<div class="pa-fields"><label class="pa-field"><span class="pa-label">Apelido ou nick novo</span><input class="pa-input" id="a-new" placeholder="Ex.: Paladincexo"></label>'
      + '<label class="pa-field"><span class="pa-label">Jogador oficial</span><input class="pa-input" id="a-tgt" list="plist" placeholder="Ex.: Paladin.Gx"></label></div>'
      + '<button class="pa-btn" data-act="add-alias">Cadastrar apelido</button><p class="pa-caption" id="a-msg" style="margin-top:12px"></p>'
      + '<ul class="pa-alist">' + Object.keys(STATE.aliases).sort().map(function(k){ return '<li><span><b>'+esc(k)+'</b> → '+esc(STATE.aliases[k])+'</span><button type="button" class="pa-btn pa-btn--ghost pa-btn--sm pa-btn--danger" data-ralias="'+esc(k)+'">✕</button></li>'; }).join('') + '</ul></div>';
  }

  function bind(){
    var app = document.getElementById('app');
    Array.prototype.forEach.call(app.querySelectorAll('[data-view]'), function(b){ b.onclick = function(){ view = b.getAttribute('data-view'); if(view==='player') selected = null; render(); }; });
    Array.prototype.forEach.call(app.querySelectorAll('[data-player]'), function(r){ r.onclick = function(){ selected = r.getAttribute('data-player'); view = 'player'; render(); window.scrollTo(0,0); }; });
    Array.prototype.forEach.call(app.querySelectorAll('[data-tp]'), function(b){
      b.onclick = function(){
        var n = b.getAttribute('data-tp'), y = window.scrollY;
        tsel[n] = ((tsel[n] || 0) + 1) % 3; if(!tsel[n]) delete tsel[n];
        saveTsel(); topt = 0; render(); window.scrollTo(0, y);
      };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-topt]'), function(b){
      b.onclick = function(){ var y = window.scrollY; topt = parseInt(b.getAttribute('data-topt'),10); render(); window.scrollTo(0, y); };
    });
    var sel = document.getElementById('psel'); if(sel) sel.onchange = function(){ selected = sel.value; render(); };
    Array.prototype.forEach.call(app.querySelectorAll('[data-act]'), function(b){
      b.onclick = function(){
        var a = b.getAttribute('data-act');
        if(a==='add-row'){ b.parentNode.querySelector('.rows').insertAdjacentHTML('beforeend', prow()); bind(); }
        else if(a==='rm-row'){ b.parentNode.remove(); }
        else if(a==='back'){ selected = null; render(); }
        else if(a==='save-match'){ saveMatch(); }
        else if(a==='add-alias'){ addAlias(); }
        else if(a==='teams-reset'){ defaultTsel(compute(STATE)); saveTsel(); topt = 0; render(); }
        else if(a==='teams-clear'){ tsel = {}; saveTsel(); topt = 0; render(); }
        else if(a==='teams-copy'){
          var txt = teamsText(compute(STATE)), m = document.getElementById('t-msg');
          function done(ok){ if(m) m.textContent = ok ? 'Copiado! Pode colar no grupo.' : 'Não consegui copiar. Selecione e copie manualmente.'; }
          try {
            if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ done(false); });
            else { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); document.body.removeChild(ta); done(ok); }
          } catch(e){ done(false); }
        }
      };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-ralias]'), function(b){
      b.onclick = function(){ delete STATE.aliases[b.getAttribute('data-ralias')]; publish(); };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-del]'), function(b){
      b.onclick = function(){
        if(!confirm('Excluir essa partida?')) return;
        var id = b.getAttribute('data-del');
        STATE.matches = STATE.matches.filter(function(m){ return m.id !== id; });
        publish();
      };
    });
  }

  function saveMatch(){
    var msg = document.getElementById('f-msg'), teams = [], seen = {}, bad = false;
    Array.prototype.forEach.call(document.querySelectorAll('.pa-tblock'), function(tb){
      var score = tb.querySelector('.ts').value, players = [];
      if(score===''){ bad = true; return; }
      Array.prototype.forEach.call(tb.querySelectorAll('.pa-prow'), function(r){
        var n = canon(r.querySelector('.pn').value), k = r.querySelector('.pk').value, d = r.querySelector('.pd').value, a = r.querySelector('.pa').value;
        if(!n && k==='' && d==='') return;
        if(!n || k==='' || d==='' || seen[n.toLowerCase()]){ bad = true; return; }
        seen[n.toLowerCase()] = 1;
        players.push({p:n,k:Math.max(0,parseInt(k,10)),d:Math.max(0,parseInt(d,10)),a:a===''?0:Math.max(0,parseInt(a,10))});
      });
      if(!players.length) bad = true;
      teams.push({score:Math.max(0,parseInt(score,10)),players:players});
    });
    if(bad || teams.length!==2){ msg.textContent = 'Confira os campos: cada time precisa de rounds e jogadores, e cada jogador de nome, K e D, sem nomes repetidos.'; return; }
    var m = {id:'m'+Date.now(),map:document.getElementById('f-map').value.trim(),teams:teams};
    var date = document.getElementById('f-date').value; if(date) m.date = date;
    STATE.matches.push(m);
    msg.textContent = 'Salvando...';
    publish();
  }

  function publish(){
    var clone = document.documentElement.cloneNode(true);
    clone.querySelector('#state').textContent = JSON.stringify(STATE).replace(/</g,'\\u003c');
    clone.querySelector('#app').innerHTML = '';
    clone.removeAttribute('data-theme');
    artifact.publish('<!doctype html>\n' + clone.outerHTML).catch(function(e){
      var m = document.getElementById('f-msg');
      if(m) m.textContent = 'Não consegui salvar (' + ((e && e.code) || 'erro') + '). Tente de novo.';
    });
  }

  render();

  (function(){
    if(!window.claude || !window.claude.use) return;
    Promise.all([window.claude.use('user'), window.claude.use('artifact')]).then(function(r){
      var user = r[0], art = r[1];
      try { isOwner = !!(user && user.isOwner()); } catch(e){ isOwner = false; }
      artifact = art;
      if(isOwner && artifact) render();
    }).catch(function(){});
  })();
})();
</script>
</body>
</html>
